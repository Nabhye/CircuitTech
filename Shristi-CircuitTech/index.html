<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AquaGuard | Login</title>

    <!-- Google Fonts -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="login-body">


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="login-background">

        <div class="grid-overlay"></div>

        <div class="glow glow-one"></div>

        <div class="glow glow-two"></div>

    </div>


    <!-- =====================================================
         LOGIN CONTAINER
    ====================================================== -->

    <main class="login-container">


        <!-- =================================================
             LOGIN CARD
        ================================================== -->

        <section class="login-card">


            <!-- =================================================
                 BRAND
            ================================================== -->

            <div class="brand">

                <div class="brand-icon">
                    <span>AG</span>
                </div>


                <div>

                    <h1>AquaGuard</h1>

                    <p>
                        Smart Water Quality Monitoring
                    </p>

                </div>

            </div>


            <!-- =================================================
                 LOGIN HEADING
            ================================================== -->

            <div class="login-heading">

                <h2>
                    Welcome back
                </h2>

                <p>
                    Sign in to access your water quality dashboard.
                </p>

            </div>


            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form id="loginForm">


                <!-- =================================================
                     EMAIL
                ================================================== -->

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>


                    <div class="input-wrapper">


                        <!-- Email Icon -->

                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                        >

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"
                            ></rect>

                            <path
                                d="m3 7 9 6 9-6"
                            ></path>

                        </svg>


                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- =================================================
                     PASSWORD
                ================================================== -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="input-wrapper">


                        <!-- Lock Icon -->

                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                        >

                            <rect
                                x="4"
                                y="10"
                                width="16"
                                height="10"
                                rx="2"
                            ></rect>

                            <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                            ></path>

                        </svg>


                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >


                        <!-- Password Visibility -->

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- =================================================
                     LOGIN OPTIONS
                ================================================== -->

                <div class="login-options">


                    <!-- Remember Me -->

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>


                    <!-- Forgot Password -->

                    <button
                        type="button"
                        class="forgot-password"
                        id="forgotPassword"
                    >

                        Forgot password?

                    </button>


                </div>


                <!-- =================================================
                     SIGN IN BUTTON
                ================================================== -->

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >

                    <span id="loginButtonText">
                        Sign in
                    </span>


                    <span
                        class="button-loader"
                        id="loginLoader"
                    ></span>

                </button>


                <!-- =================================================
                     DIVIDER
                ================================================== -->

                <div class="login-divider">

                    <span></span>

                    <p>
                        OR
                    </p>

                    <span></span>

                </div>


                <!-- =================================================
                     GOOGLE LOGIN
                ================================================== -->

                <button
                    type="button"
                    class="google-login-button"
                    id="googleLoginButton"
                >


                    <!-- Google Logo -->

                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                    >

                        <path
                            fill="#4285F4"
                            d="M21.35 12.23c0-.79-.07-1.55-.23-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42Z"
                        />

                        <path
                            fill="#34A853"
                            d="M12 21.5c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.93-3.31.93-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.75 9.75 0 0 0 12 21.5Z"
                        />

                        <path
                            fill="#FBBC05"
                            d="M6.54 13.6a5.86 5.86 0 0 1 0-3.2V7.87H3.3a9.75 9.75 0 0 0 0 8.26l3.24-2.53Z"
                        />

                        <path
                            fill="#EA4335"
                            d="M12 6.37c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.48 14.63 2.5 12 2.5a9.75 9.75 0 0 0-8.7 5.37l3.24 2.53C7.31 8.09 9.46 6.37 12 6.37Z"
                        />

                    </svg>


                    <span>
                        Continue with Google
                    </span>


                </button>


                <!-- =================================================
                     ERROR MESSAGE
                ================================================== -->

                <div
                    class="error-message"
                    id="loginError"
                ></div>


            </form>


            <!-- =================================================
                 FOOTER
            ================================================== -->

            <div class="login-footer">

                <span>
                    Protected by
                </span>

                <strong>
                    Firebase Authentication
                </strong>

            </div>


        </section>


    </main>


    <!-- =====================================================
         LOGIN JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="js/login.js"
    ></script>


</body>

</html>
